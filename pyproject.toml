[project]
name = "engineering-support-agent"
version = "0.1.0"
description = "Read-only incident investigation with reproducible tool-calling demos"
readme = "README.md"
license = "MIT"
authors = [{ name = "Georges Chamma" }]
requires-python = ">=3.12"
dependencies = [
  "langchain[mcp]==1.4.0",
  "langchain-openai==1.6.1",
  "langgraph==1.2.11",
  "pydantic==2.13.5",
  "mcp==2.2.0",
]

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
